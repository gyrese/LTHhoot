name: Docker Latest

# Publie l'image `latest` UNIQUEMENT quand la CI du commit est verte. Auparavant
# ce workflow partait sur `push: main` en parallele de la CI : une image issue
# d'un build rouge pouvait donc etre publiee, et c'est arrive. Le declenchement
# manuel (workflow_dispatch) reste possible, sans condition.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # `workflow_dispatch` n'a pas de `workflow_run` : la condition ne doit
    # bloquer que le declenchement automatique.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # `workflow_run` s'execute sur le HEAD du depot par defaut : on cible
          # explicitement le commit dont la CI vient de passer.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lthoot:latest
          no-cache: true

  # Pas de déploiement automatique : la mise à jour du VPS se fait à la main
  # (docker compose pull && docker compose up -d dans le dossier de l'app).
