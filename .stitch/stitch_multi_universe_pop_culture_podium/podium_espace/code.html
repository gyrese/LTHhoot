<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .glass-podium {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 20px rgba(0, 238, 252, 0.2);
        }
        .hologram-frame {
            position: relative;
        }
        .hologram-frame::after {
            content: '';
            position: absolute;
            inset: -4px;
            border: 2px solid #00eefc;
            border-radius: 50%;
            animation: rotate-glow 4s linear infinite;
            box-shadow: 0 0 15px #00eefc;
        }
        @keyframes rotate-glow {
            0% { transform: rotate(0deg) scale(1); opacity: 0.8; }
            50% { transform: rotate(180deg) scale(1.05); opacity: 1; }
            100% { transform: rotate(360deg) scale(1); opacity: 0.8; }
        }
        .nebula-float {
            animation: float 20s ease-in-out infinite alternate;
        }
        @keyframes float {
            from { transform: scale(1) translate(0, 0); }
            to { transform: scale(1.1) translate(2%, 2%); }
        }
        .stardust {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite alternate;
        }
        @keyframes twinkle {
            from { opacity: 0.2; transform: scale(1); }
            to { opacity: 1; transform: scale(1.5); }
        }
    </style>

<!-- Interactive Layer: Starfield Generator -->
<script>
        const starfield = document.getElementById('starfield');
        const starCount = 150;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'stardust';
            
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            const duration = 1 + Math.random() * 3;
            const delay = Math.random() * 5;
            
            star.style.left = `${x}%`;
            star.style.top = `${y}%`;
            star.style.setProperty('--duration', `${duration}s`);
            star.style.animationDelay = `${delay}s`;
            
            starfield.appendChild(star);
        }

        // Mouse move parallax effect for nebula background
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 50;
            const moveY = (e.clientY - window.innerHeight / 2) / 50;
            const nebula = document.querySelector('.nebula-float');
            if (nebula) {
                nebula.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.05)`;
            }
        });
    </script>
