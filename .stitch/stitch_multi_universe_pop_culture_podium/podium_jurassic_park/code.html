<style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .fossil-border {
            position: relative;
            padding: 12px;
            background: linear-gradient(135deg, #4e4632 0%, #353439 100%);

            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .moss-texture {
            background-image: radial-gradient(circle at 20% 30%, rgba(34, 197, 94, 0.2) 0%, transparent 50%),

<!-- Atmospheric Particles -->
<div class="absolute inset-0 z-20 pointer-events-none opacity-30">
<script>
                document.addEventListener('DOMContentLoaded', () => {
                    const container = document.body;
                    for(let i=0; i<30; i++) {
                        let particle = document.createElement('div');
                        particle.className = 'absolute bg-primary-fixed w-1 h-1 rounded-full blur-[1px]';
                        particle.style.left = Math.random() * 100 + '%';
                        particle.style.top = Math.random() * 100 + '%';
                        particle.style.opacity = Math.random();
                        particle.style.animation = `float ${5 + Math.random() * 5}s infinite`;
                        container.appendChild(particle);
                    }
                });
            </script>
</div>
</div>
<!-- Navigation Header -->

</div>

<!-- Footer Status -->

<script>
        // Micro-interaction for hover states
        document.querySelectorAll('.fossil-border').forEach(el => {
            el.addEventListener('mouseenter', () => {
                el.style.transform = 'rotate(2deg) scale(1.05)';
            });
            el.addEventListener('mouseleave', () => {
                el.style.transform = 'rotate(0deg) scale(1)';
            });
        });
    </script>
