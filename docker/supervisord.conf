[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:socket]
command=node /app/socket/index.cjs
; UV_THREADPOOL_SIZE : Sharp (libvips) tourne sur le threadpool libuv, PAS sur la
; boucle d'événements JS — il ne bloque donc pas le temps-réel. On élargit
; néanmoins le pool pour qu'une conversion d'image (édition de quiz) ne prive pas
; les autres opérations async du threadpool. cf. tasks/todo.md (Palier 1.1).
environment=NODE_ENV="production",CONFIG_PATH="/app/config",UV_THREADPOOL_SIZE="8"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
