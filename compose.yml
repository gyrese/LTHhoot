services:
  ltnhoot:
    image: gyrese/lthoot:latest
    container_name: ltnhoot
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY}
      - GIPHY_API_KEY=${GIPHY_API_KEY}
    networks:
      - nginx-proxy-network
    volumes:
      - ./config:/app/config
      - ./packages/web/public/pets:/app/web/pets
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  nginx-proxy-network:
    external: true
