services:
  ltnhoot:
    image: gyrese/lthoot:latest
    restart: unless-stopped
    ports:
      - "3030:3000"
    volumes:
      - ./config:/app/config
      - ./packages/web/public/pets:/app/web/pets
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
